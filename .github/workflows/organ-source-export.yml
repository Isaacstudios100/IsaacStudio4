name: Export Organ Source for Review
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project source
        run: |
          set -euo pipefail
          unzip -q IsaacStudio4-source.zip -d source
          mkdir -p review
          cp -R source/app/src/main/java review/java
          cp -R source/app/src/main/res review/res
          cp source/app/build.gradle.kts review/
          cd review
          zip -qr ../Organ-Source-Review.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Organ-Source-Review
          path: Organ-Source-Review.zip
          retention-days: 3
