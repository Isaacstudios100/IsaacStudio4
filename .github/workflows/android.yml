
name: Build Isaac Studio 4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: unzip IsaacStudio4-source.zip -d source
      - name: Fetch pinned Xiph decoder sources
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p app/src/main/cpp/third_party
          mkdir -p app/src/main/assets/third-party-licenses

          curl -fL --retry 3 -o "$RUNNER_TEMP/libogg-1.3.6.tar.gz" \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.6.tar.gz
          echo "83e6704730683d004d20e21b8f7f55dcb3383cdf84c0daedf30bde175f774638  $RUNNER_TEMP/libogg-1.3.6.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/libogg-1.3.6.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/libogg-1.3.6" app/src/main/cpp/third_party/ogg
          cp app/src/main/cpp/third_party/ogg/COPYING app/src/main/assets/third-party-licenses/libogg-COPYING.txt

          curl -fL --retry 3 -o "$RUNNER_TEMP/opus-1.5.2.tar.gz" \
            https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
          echo "65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1  $RUNNER_TEMP/opus-1.5.2.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/opus-1.5.2.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/opus-1.5.2" app/src/main/cpp/third_party/opus
          cp app/src/main/cpp/third_party/opus/COPYING app/src/main/assets/third-party-licenses/opus-COPYING.txt

          curl -fL --retry 3 -o "$RUNNER_TEMP/opusfile-0.12.tar.gz" \
            https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz
          echo "118d8601c12dd6a44f52423e68ca9083cc9f2bfe72da7a8c1acb22a80ae3550b  $RUNNER_TEMP/opusfile-0.12.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/opusfile-0.12.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/opusfile-0.12" app/src/main/cpp/third_party/opusfile
          cp app/src/main/cpp/third_party/opusfile/COPYING app/src/main/assets/third-party-licenses/opusfile-COPYING.txt

          test -f app/src/main/cpp/third_party/ogg/src/framing.c
          test -f app/src/main/cpp/third_party/opus/CMakeLists.txt
          test -f app/src/main/cpp/third_party/opusfile/src/opusfile.c
          test -f app/src/main/assets/third-party-licenses/libogg-COPYING.txt
          test -f app/src/main/assets/third-party-licenses/opus-COPYING.txt
          test -f app/src/main/assets/third-party-licenses/opusfile-COPYING.txt

      - name: Diagnose Ninja regeneration
        working-directory: source
        shell: bash
        run: |
          set -uo pipefail
          gradle ':app:configureCMakeDebug[arm64-v8a]'
          NINJA="$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          BUILD_FILE="$(find app/.cxx -name build.ninja -print -quit)"
          if [ -z "$BUILD_FILE" ] || [ ! -x "$NINJA" ]; then
            echo "DIAGNOSTIC STOP: build.ninja or NDK Ninja executable not found"
            find app/.cxx -maxdepth 5 -type f -name build.ninja -print || true
            exit 1
          fi
          BUILD_DIR="$(dirname "$BUILD_FILE")"
          echo "=== BUILD DIRECTORY ==="
          echo "$BUILD_DIR"
          echo "=== RELEVANT FILE TIMESTAMPS ==="
          for f in "$BUILD_DIR/build.ninja" "$BUILD_DIR/CMakeCache.txt" "$BUILD_DIR/CMakeFiles/VerifyGlobs.cmake" "$BUILD_DIR/CMakeFiles/cmake.check_cache"; do
            if [ -f "$f" ]; then stat -c '%y %n' "$f"; fi
          done
          echo "=== NINJA REGENERATION EXPLANATION ==="
          "$NINJA" -C "$BUILD_DIR" -d explain -n 2>&1 | tee "$RUNNER_TEMP/ninja-explain.log" || true
          echo "=== END DIAGNOSTIC ==="

      - name: Build debug APK
        working-directory: source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IsaacStudio4-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
